name: Complete SDK Release

on:
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Successful non-dry-run deployment (public package checks must have passed)
        required: true
        type: string
      evidence_json:
        description: Same candidate identity plus post-release device tests and restored state
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  complete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DELIVERY_RUN: ${{ inputs.deployment_run_id }}
      EVIDENCE_JSON: ${{ inputs.evidence_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require successful deployment
        run: python tools/workflow/run-provenance.py --run-id "$DELIVERY_RUN" --workflow deployment.yml
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.deployment_run_id }}
          name: release-record
          path: build/delivery
      - name: Read delivered identity
        id: delivery
        run: |
          python -c 'import json,os; d=json.load(open("build/delivery/release-record.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); [print(k.lower()+"="+v,file=f) for k,v in d.items()]'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.delivery.outputs.candidate_run }}
          pattern: sdk-candidate-*
          merge-multiple: true
          path: build/candidate
      - name: Require post-release device evidence and restored device state
        env:
          VERSION: ${{ steps.delivery.outputs.version }}
          CANDIDATE_RUN: ${{ steps.delivery.outputs.candidate_run }}
        run: |
          python -c 'import os,pathlib,json; d=json.loads(os.environ["EVIDENCE_JSON"]); assert str(d.get("deployment_run_id")) == os.environ["DELIVERY_RUN"], "Evidence delivery run mismatch"; pathlib.Path("build/completion-evidence.json").write_text(json.dumps(d),encoding="utf-8")'
          python tools/workflow/evidence.py validate --kind m3sdk --stage complete --root build/candidate             --evidence build/completion-evidence.json --version "$VERSION" --run-id "$CANDIDATE_RUN"
      - name: Publish release only after all completion evidence passes
        env:
          VERSION: ${{ steps.delivery.outputs.version }}
          RELEASE_SHA: ${{ steps.delivery.outputs.release_sha }}
        run: |
          git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION" --depth=1
          test "$(git rev-parse "$VERSION^{commit}")" = "$RELEASE_SHA"
          gh release edit "$VERSION" --draft=false --latest
          echo 'SDK delivery and post-release verification complete. Jira is not automatically changed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: completion-evidence
          path: build/completion-evidence.json
