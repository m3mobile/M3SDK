name: Deployment

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Verified candidate version
        required: true
        type: string
      candidate_run_id:
        description: Successful manual Verify SDK Candidate run
        required: true
        type: string
      dry_run:
        description: Gate and prepare only, without publication
        default: true
        type: boolean
      rehearsal:
        description: Isolated rehearsal on this exact branch/SHA; no external publication
        default: false
        type: boolean
      rehearsal_case:
        description: Rehearsal-only failure injection
        default: normal
        type: choice
        options: [normal, android-failure, dotnet-failure, consumer-skip, tamper]

permissions:
  contents: read
  actions: read

env:
  RELEASE_MODE: ${{ inputs.rehearsal && 'rehearsal' || (inputs.dry_run && 'dry-run' || 'publish') }}

concurrency:
  group: sdk-release-${{ inputs.rehearsal && 'rehearsal' || 'production' }}-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  rehearsal:
    if: inputs.rehearsal
    uses: ./.github/workflows/rehearse-release.yml
    with:
      version: ${{ inputs.tag_name }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      scenario: ${{ inputs.rehearsal_case }}

  gate:
    if: ${{ !inputs.rehearsal }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      VERSION: ${{ inputs.tag_name }}
      CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: sdk-candidate-*
          merge-multiple: true
          path: build/candidate
      - name: Verify completed develop candidate and exact files
        id: identity
        run: python tools/workflow/release_flow.py gate
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: promotion-verification-${{ github.run_attempt }}
          path: build/candidate-verification.json
          if-no-files-found: error

  prepare:
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: sdk-candidate-*
          merge-multiple: true
          path: build/candidate
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.gate.outputs.artifact_id }}
          merge-multiple: true
          path: build
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 0
          path: release-source
      - name: Prepare exact documentation commit, bundle and publication plan without writing remotely
        run: python tools/workflow/release_flow.py prepare
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-plan-${{ github.run_attempt }}
          path: build/plan/
          if-no-files-found: error

  publish:
    needs: [gate, prepare]
    if: ${{ !inputs.rehearsal && !inputs.dry_run && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sdk-release
    permissions:
      contents: write
      actions: read
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
    env:
      VERSION: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: sdk-candidate-*
          merge-multiple: true
          path: build/candidate
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: build/plan
      - name: Restore exact prepared commit and recheck candidate before any publication
        id: identity
        run: |
          test -n "$NUGET_API_KEY" || { echo 'NUGET_API_KEY required'; exit 1; }
          git clone build/plan/release.bundle release-source
          python tools/workflow/release_flow.py check
          echo "release_sha=$(git -C release-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish prepared tag without rebuilding packages
        run: |
          git fetch build/plan/release.bundle HEAD
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' tag -a "$VERSION" "${{ steps.identity.outputs.release_sha }}" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
      - name: Publish the tested NuGet file
        run: dotnet nuget push "build/candidate/nuget/M3Mobile.M3Sdk.Xamarin.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Create a new draft and bind its actual ID to this run
        run: |
          notes=$(python -c 'import sys; sys.path.insert(0,"tools/workflow"); from release_flow import marker; from artifacts import read_json; from pathlib import Path; print(marker(read_json(Path("build/plan/release-plan.json"))))')
          RELEASE_ID=$(gh api "repos/$GH_REPO/releases" --method POST -f tag_name="$VERSION" -f name="$VERSION" -f body="$notes" -F draft=true --jq .id)
          export RELEASE_ID
          python tools/workflow/release_flow.py record
          gh release upload "$VERSION" build/candidate/manuals/*.pdf build/candidate/nuget/*.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: build/release-record.json
          if-no-files-found: error

  verify-public:
    needs: publish
    uses: ./.github/workflows/verify-published-samples.yml
    with:
      version: ${{ inputs.tag_name }}
      source_sha: ${{ needs.publish.outputs.release_sha }}

  finalize:
    needs: [gate, prepare, publish, verify-public]
    if: ${{ !inputs.rehearsal && !inputs.dry_run && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && needs.gate.result == 'success' && needs.prepare.result == 'success' && needs.publish.result == 'success' && needs.verify-public.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: build/plan
      - uses: actions/download-artifact@v4
        with:
          name: release-record
          path: build
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: sdk-candidate-*
          merge-multiple: true
          path: build/candidate
      - name: Publish only this run's Release ID after both public consumers succeed
        run: python tools/workflow/release_flow.py finalize
      - uses: actions/upload-artifact@v4
        with:
          name: completion-${{ github.run_attempt }}
          path: build/completion.json
          if-no-files-found: error

  summary:
    needs: [gate, prepare, publish, verify-public, finalize, rehearsal]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: |
          echo "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Dry-run/rehearsal do not publish. Device verification remains pending. Remote reviewer policy is configured separately.' >> "$GITHUB_STEP_SUMMARY"
