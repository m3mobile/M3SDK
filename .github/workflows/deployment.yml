name: Deployment

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Verified candidate version
        required: true
        type: string
      candidate_run_id:
        description: Successful Verify SDK Candidate dispatch run (build once, promote unchanged)
        required: true
        type: string
      evidence_json:
        description: Completed pre-release evidence JSON; see docs/development-workflow.md
        required: true
        type: string
      dry_run:
        description: Validate evidence and artifacts without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: sdk-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    env:
      VERSION: ${{ inputs.tag_name }}
      CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
      EVIDENCE_JSON: ${{ inputs.evidence_json }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: sdk-candidate-*
          merge-multiple: true
          path: build/candidate
      - name: Verify candidate workflow provenance
        run: python tools/workflow/run-provenance.py --run-id "$CANDIDATE_RUN" --workflow verify-candidate.yml --root build/candidate
      - name: Verify artifact hashes, review, device tests and regression decisions
        id: identity
        run: |
          python -c 'import os,pathlib; pathlib.Path("build/evidence.json").write_text(os.environ["EVIDENCE_JSON"], encoding="utf-8")'
          python tools/workflow/evidence.py validate --kind m3sdk --root build/candidate \
            --evidence build/evidence.json --version "$VERSION" --run-id "$CANDIDATE_RUN"
          python -c 'import json,os; d=json.load(open("build/candidate/candidate-android.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); print("source_sha="+d["source_sha"],file=f)'
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-evidence
          path: build/evidence.json

  publish:
    needs: gate
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sdk-release
    permissions:
      contents: write
      actions: read
    outputs:
      release_sha: ${{ steps.tag.outputs.release_sha }}
    env:
      VERSION: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: sdk-candidate-*
          merge-multiple: true
          path: build/candidate
      - name: Recheck reviewed artifact hashes before publishing
        env:
          EVIDENCE_JSON: ${{ inputs.evidence_json }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          python -c 'import os,pathlib; pathlib.Path("build/evidence.json").write_text(os.environ["EVIDENCE_JSON"],encoding="utf-8")'
          python tools/workflow/evidence.py validate --kind m3sdk --root build/candidate --evidence build/evidence.json --version "$VERSION" --run-id "$CANDIDATE_RUN"
      - name: Validate publication prerequisites
        run: |
          test -n "$NUGET_API_KEY" || { echo 'NUGET_API_KEY required'; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo 'Tag already exists; inspect partial release before recovery'; exit 1
          fi
          test -f "build/candidate/nuget/M3Mobile.M3Sdk.Xamarin.$VERSION.nupkg"
      - name: Prepare documentation commit and publish tag
        id: tag
        run: |
          node tools/release/prepare-release.js --version "$VERSION" --repo-root .
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md docs dotnet/M3Mobile.M3Sdk.Xamarin/README.md
          if ! git diff --cached --quiet; then git commit -m "release: $VERSION documentation"; fi
          # Only documentation may differ from the tested candidate source.
          git diff --exit-code ${{ needs.gate.outputs.source_sha }} HEAD -- . ':!docs' ':!README.md' ':!dotnet/M3Mobile.M3Sdk.Xamarin/README.md'
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the tested NuGet file without rebuilding
        run: dotnet nuget push "build/candidate/nuget/M3Mobile.M3Sdk.Xamarin.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Create GitHub Release and record delivery
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          RELEASE_SHA: ${{ steps.tag.outputs.release_sha }}
        run: |
          gh release create "$VERSION" build/candidate/manuals/*.pdf build/candidate/nuget/*.nupkg \
            --verify-tag --draft --title "$VERSION" --notes "Candidate run: $CANDIDATE_RUN. Automated public-package verification follows; manual post-release verification remains required."
          python -c 'import json,os,pathlib; pathlib.Path("build/release-record.json").write_text(json.dumps({k:os.environ[k] for k in ["VERSION","CANDIDATE_RUN","RELEASE_SHA"]}),encoding="utf-8")'
      - uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: build/release-record.json

  verify-public:
    needs: publish
    uses: ./.github/workflows/verify-published-samples.yml
    with:
      version: ${{ inputs.tag_name }}
      source_sha: ${{ needs.publish.outputs.release_sha }}

  summary:
    needs: [gate, publish, verify-public]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Report delivery state without claiming device verification
        run: |
          echo "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Delivery is not task completion. Run Complete SDK Release with post-release device evidence.' >> "$GITHUB_STEP_SUMMARY"
