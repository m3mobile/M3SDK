name: Publish Alpha Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Alpha package version, for example 2.3.8-alpha.1"
        required: true
        type: string
      dry_run:
        description: "Build alpha artifacts without publishing to GitHub Packages"
        required: true
        default: true
        type: boolean
      target:
        description: "Package platform to build and publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - xamarin

env:
  ALPHA_VERSION: ${{ inputs.version }}

permissions:
  contents: read
  packages: write

concurrency:
  group: alpha-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    uses: ./.github/workflows/verify-candidate.yml
    with:
      version: ${{ inputs.version }}

  publish-android-alpha:
    needs: verify-candidate
    name: Publish Android alpha to GitHub Packages
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$ALPHA_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Invalid alpha version: $VERSION" >&2
            exit 1
          fi

      - name: Build Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew apiCheck assembleRelease

      - name: Publish Android artifacts
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./gradlew publish \
            -Pm3sdk.publish.version="${{ inputs.version }}" \
            -Pm3sdk.githubPackagesUrl="https://maven.pkg.github.com/${{ github.repository }}" \
            -Pm3sdk.githubPackagesUser="${{ github.actor }}" \
            -Pm3sdk.githubPackagesToken="$GITHUB_TOKEN"

  publish-xamarin-alpha:
    needs: verify-candidate
    name: Publish Xamarin alpha to GitHub Packages
    if: ${{ inputs.target == 'all' || inputs.target == 'xamarin' }}
    runs-on: windows-2022
    steps:
      - uses: NuGet/setup-nuget@v2

      - uses: actions/download-artifact@v4
        with:
          name: sdk-candidate-dotnet
          path: build/candidate

      - name: Validate version
        shell: powershell
        run: |
          if ($env:ALPHA_VERSION -notmatch '^\d+\.\d+\.\d+-alpha\.\d+$') {
            throw "Invalid alpha version: $env:ALPHA_VERSION"
          }
          if (-not (Test-Path "build/candidate/nuget/M3Mobile.M3Sdk.Xamarin.$env:ALPHA_VERSION.nupkg")) {
            throw 'Tested candidate NuGet package missing'
          }

      - name: Publish NuGet package to GitHub Packages
        if: ${{ inputs.dry_run != true }}
        shell: powershell
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:GITHUB_TOKEN) {
            throw "GITHUB_TOKEN is required to publish GitHub Packages NuGet packages."
          }

          $sourceName = "m3sdk-github-packages"
          nuget sources Add `
            -Name $sourceName `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -UserName $env:GITHUB_ACTOR `
            -Password $env:GITHUB_TOKEN `
            -StorePasswordInClearText `
            -NonInteractive

          Get-ChildItem build\candidate\nuget\*.nupkg | ForEach-Object {
            nuget push $_.FullName `
              -ApiKey $env:GITHUB_TOKEN `
              -Source $sourceName `
              -SkipDuplicate `
              -NonInteractive
          }

      - name: Upload alpha NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: xamarin-alpha-nuget
          path: build/candidate/nuget/*.nupkg
          if-no-files-found: error
