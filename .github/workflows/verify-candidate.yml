name: Verify SDK Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate package version (same version will be released)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate version and workflow gates
        run: |
          python -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", os.environ["VERSION"])'
          python -m unittest discover -s tools/workflow -p 'test_*.py'
          node --test tools/release/prepare-release.test.js
      - name: Test, check API, and publish to isolated file repository
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest apiCheck assembleRelease publishToMavenLocal \
            "-Pm3sdk.publish.version=$VERSION" "-Dmaven.repo.local=$PWD/build/candidate/maven"
      - name: Build consumer using candidate packages
        run: |
          ./gradlew --no-daemon -p samples/android-compose-jitpack :app:testDebugUnitTest :app:assembleRelease \
            "-Pm3SdkVersion=$VERSION" "-Pm3SdkRepository=$PWD/build/candidate/maven" \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' --max-workers=2
          mkdir -p build/candidate/samples
          cp samples/android-compose-jitpack/app/build/outputs/apk/release/*.apk build/candidate/samples/
      - name: Generate versioned manuals
        run: |
          node tools/release/prepare-release.js --version "$VERSION" --repo-root .
          npm ci --prefix tools/MdToPdf
          npm run validate:manuals --prefix tools/MdToPdf
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum fonts-nanum-coding
          npm install -g md-to-pdf
          node tools/MdToPdf/convert-md-to-pdf.js \
            --input docs/M3SDK_Manual_en.md --input docs/M3SDK_Manual_kr.md \
            --input docs/M3SDK_Xamarin_Manual_en.md --input docs/M3SDK_Xamarin_Manual_kr.md \
            --output build/candidate/manuals \
            --repo-root . --temp build/md-to-pdf --version "$VERSION" --clean
      - name: Record candidate identity
        run: python tools/workflow/evidence.py manifest --root build/candidate --name android --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-candidate-android
          path: build/candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-android-test-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**

  dotnet:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Test, build legacy Xamarin package, and build package consumer
        shell: pwsh
        run: ./tools/workflow/build-nuget-candidate.ps1 -Version $env:VERSION
      - name: Record candidate identity
        shell: pwsh
        run: python tools/workflow/evidence.py manifest --root build/candidate --name dotnet --source-sha $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-candidate-dotnet
          path: build/candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-dotnet-test-results
          path: build/workflow-tests/
