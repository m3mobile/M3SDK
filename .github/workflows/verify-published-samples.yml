name: Verify Published Samples

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Published SDK tag/package version"
        required: true
        type: string
      source_sha:
        description: Expected tagged source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: published-samples-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  android-jitpack:
    name: Android Compose sample from JitPack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M3_SDK_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M3_SDK_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify exact release source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Assert no local SDK dependency
        shell: bash
        run: |
          set -euo pipefail
          if grep -RE 'project\([^)]*sdk|projects\.sdk' samples/android-compose-jitpack; then
            echo "Android published-package sample must not reference a local SDK project." >&2
            exit 1
          fi

      - name: Build against JitPack release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4 5 6; do
            if ./gradlew -p samples/android-compose-jitpack :app:assembleRelease \
              -Pm3SdkVersion="$M3_SDK_VERSION" --refresh-dependencies; then
              exit 0
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "JitPack sample build failed after $attempt attempts." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Verify signed release sample
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose samples/android-compose-jitpack/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-compose-published-sample-${{ env.M3_SDK_VERSION }}
          path: samples/android-compose-jitpack/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  dotnet-nuget:
    name: .NET for Android sample from NuGet Gallery
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      M3_SDK_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M3_SDK_VERSION }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET Android workload
        shell: powershell
        run: dotnet workload install android

      - name: Install consumer Android SDK dependencies
        shell: pwsh
        run: |
          dotnet build samples/dotnet-android-nuget/M3SdkPublishedSample.csproj `
            -t:InstallAndroidDependencies -p:AcceptAndroidSdkLicenses=true `
            "-p:M3SdkVersion=$env:M3_SDK_VERSION" -p:UseLocalM3Sdk=false `
            "-p:AndroidSdkDirectory=$env:ANDROID_HOME" `
            -p:RestoreSources=https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK dependency installation failed' }

      - name: Verify exact release source
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Release source mismatch' }

      - name: Assert no local SDK dependency
        shell: powershell
        run: |
          $project = "samples\dotnet-android-nuget\M3SdkPublishedSample.csproj"
          $output = & dotnet msbuild $project `
            "-getItem:ProjectReference" `
            "-p:M3SdkVersion=$env:M3_SDK_VERSION" `
            "-p:UseLocalM3Sdk=false"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to evaluate the published-package sample dependencies."
          }
          $evaluated = ($output -join "`n") | ConvertFrom-Json
          if (@($evaluated.Items.ProjectReference).Count -ne 0) {
            throw ".NET published-package sample must not reference a local SDK project."
          }

      - name: Restore published NuGet package
        shell: powershell
        run: |
          $project = "samples\dotnet-android-nuget\M3SdkPublishedSample.csproj"
          foreach ($attempt in 1..12) {
            dotnet restore $project `
              -p:M3SdkVersion="$env:M3_SDK_VERSION" `
              -p:UseLocalM3Sdk=false `
              "-p:AndroidSdkDirectory=$env:ANDROID_HOME" `
              --source https://api.nuget.org/v3/index.json `
              --packages "$env:RUNNER_TEMP/public-nuget-cache" `
              --no-cache
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 12) { throw "NuGet restore failed after $attempt attempts." }
            Start-Sleep -Seconds 30
          }

      - name: Build published NuGet sample
        shell: powershell
        run: |
          dotnet build samples\dotnet-android-nuget\M3SdkPublishedSample.csproj `
            -p:M3SdkVersion="$env:M3_SDK_VERSION" `
            -p:UseLocalM3Sdk=false `
            "-p:AndroidSdkDirectory=$env:ANDROID_HOME" `
            -p:RestorePackagesPath="$env:RUNNER_TEMP/public-nuget-cache" `
            --no-restore `
            --configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-android-published-sample-${{ env.M3_SDK_VERSION }}
          path: samples/dotnet-android-nuget/bin/Release/**/*.apk
          if-no-files-found: error
