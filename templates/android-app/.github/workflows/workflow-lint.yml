name: Workflow Configuration Checks

on:
  pull_request:
  push:
    branches: [dev, main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck= -pyflakes=
